{% extends "base.html" %}

{% block title %}403 - Forbidden{% endblock %}

{% block content %}
<div class="closed-wrapper">
    <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">🛡️</div>
    <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem;">403 - Access Forbidden</h1>
    <p style="color: var(--text-secondary); max-width: 500px; margin-bottom: 1.5rem;">
        You do not have permission to access this resource or perform this action outside permitted parameters.
    </p>
    <a href="{{ url_for('exam.exam_page') }}" class="btn btn-primary">Return to Daily Exam</a>
</div>
{% endblock %}
